name: Integración continua (Maven)

on:
  push:
    branches: [ "main", "remotaAngel" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compilar, probar y empaquetar
        run: mvn -B verify
      - name: Guardar UCHoteles.ear
        uses: actions/upload-artifact@v4
        with:
          name: UCHoteles-ear
          path: UCHotelesEAR/target/UCHoteles.ear
